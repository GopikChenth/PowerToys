<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="start-title">
  <title id="start-title">Getting Started section</title>
  <rect width="1200" height="140" rx="14" fill="#141315"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="140" rx="2" fill="#50e3c2"/>

  <!-- Section icon: terminal prompt -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#1c1a1e" stroke="#2c2832" stroke-width="1"/>
    <!-- > prompt caret -->
    <text x="14" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" font-weight="700" fill="#50e3c2">$</text>
    <rect x="32" y="26" width="12" height="3" rx="1" fill="#f0eff1" opacity="0.7"/>
  </g>

  <text x="116" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="700" fill="#f0eff1" letter-spacing="-0.5">Getting Started</text>
  <text x="116" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="400" fill="#8a888c">Install dependencies, build from source, and start picking colors</text>

  <!-- Right-side: command hint -->
  <g transform="translate(960, 46)">
    <rect x="0" y="0" width="190" height="48" rx="6" fill="#1c1a1e" stroke="#2c2832" stroke-width="1"/>
    <text x="14" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="500" fill="#50e3c2">$</text>
    <text x="28" y="20" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="500" fill="#f0eff1">cargo build</text>
    <text x="14" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="500" fill="#50e3c2">$</text>
    <text x="28" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="12" font-weight="500" fill="#f0eff1">./powertoys</text>
  </g>
</svg>
