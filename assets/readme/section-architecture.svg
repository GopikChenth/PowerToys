<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="arch-title">
  <title id="arch-title">Architecture section</title>
  <rect width="1200" height="140" rx="14" fill="#141315"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="140" rx="2" fill="#0078d4"/>

  <!-- Section icon: module blocks -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#1c1a1e" stroke="#2c2832" stroke-width="1"/>
    <rect x="10" y="10" width="16" height="16" rx="3" fill="#0078d4"/>
    <rect x="30" y="10" width="16" height="16" rx="3" fill="#2b8396"/>
    <rect x="10" y="30" width="16" height="16" rx="3" fill="#b59ee6"/>
    <rect x="30" y="30" width="16" height="16" rx="3" fill="#50e3c2"/>
  </g>

  <text x="116" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="700" fill="#f0eff1" letter-spacing="-0.5">Architecture</text>
  <text x="116" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="400" fill="#8a888c">Modular Rust codebase with Slint UI, IPC daemon, and Hyprland integration</text>

  <!-- Right-side: mini module diagram -->
  <g transform="translate(1000, 36)">
    <rect x="0" y="16" width="60" height="24" rx="4" fill="#1c1a1e" stroke="#2c2832" stroke-width="1"/>
    <text x="30" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" font-weight="600" fill="#8a888c" text-anchor="middle">core/</text>
    <rect x="80" y="0" width="60" height="24" rx="4" fill="#1c1a1e" stroke="#2c2832" stroke-width="1"/>
    <text x="110" y="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" font-weight="600" fill="#b59ee6" text-anchor="middle">ui/</text>
    <rect x="80" y="32" width="60" height="24" rx="4" fill="#1c1a1e" stroke="#2c2832" stroke-width="1"/>
    <text x="110" y="49" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="10" font-weight="600" fill="#8a888c" text-anchor="middle">modules/</text>
    <line x1="60" y1="28" x2="80" y2="12" stroke="#38343e" stroke-width="1"/>
    <line x1="60" y1="28" x2="80" y2="44" stroke="#38343e" stroke-width="1"/>
  </g>
</svg>
