<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="feat-title">
  <title id="feat-title">Features section</title>
  <rect width="1200" height="140" rx="14" fill="#141315"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="140" rx="2" fill="#b59ee6"/>

  <!-- Section icon: eyedropper -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="56" height="56" rx="12" fill="#1c1a1e" stroke="#2c2832" stroke-width="1"/>
    <circle cx="28" cy="24" r="8" fill="none" stroke="#b59ee6" stroke-width="2"/>
    <line x1="28" y1="14" x2="28" y2="18" stroke="#b59ee6" stroke-width="2" stroke-linecap="round"/>
    <line x1="28" y1="30" x2="28" y2="34" stroke="#b59ee6" stroke-width="2" stroke-linecap="round"/>
    <line x1="18" y1="24" x2="22" y2="24" stroke="#b59ee6" stroke-width="2" stroke-linecap="round"/>
    <line x1="34" y1="24" x2="38" y2="24" stroke="#b59ee6" stroke-width="2" stroke-linecap="round"/>
    <rect x="12" y="38" width="32" height="8" rx="2" fill="#38343e"/>
    <rect x="12" y="38" width="20" height="8" rx="2" fill="#b59ee6" opacity="0.5"/>
  </g>

  <text x="116" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="32" font-weight="700" fill="#f0eff1" letter-spacing="-0.5">Features</text>
  <text x="116" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="18" font-weight="400" fill="#8a888c">Production-ready color utilities with Wayland-native tooling</text>

  <!-- Right-side color swatches (motif) -->
  <g transform="translate(1020, 40)">
    <rect x="0" y="0" width="18" height="60" rx="3" fill="#d4c2f0"/>
    <rect x="24" y="0" width="18" height="60" rx="3" fill="#b59ee6"/>
    <rect x="48" y="0" width="18" height="60" rx="3" fill="#9580c0"/>
    <rect x="72" y="0" width="18" height="60" rx="3" fill="#76639a"/>
    <rect x="96" y="0" width="18" height="60" rx="3" fill="#574c75"/>
  </g>
</svg>
